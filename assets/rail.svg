<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">DREADRAIL freight-car corridor</title>
  <desc id="desc">A moody original perspective illustration inside a steel train carriage, with amber lights, pipes, a closed containment door, and one red warning lamp.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="650" gradientUnits="userSpaceOnUse"><stop stop-color="#111e22"/><stop offset="1" stop-color="#344042"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="415" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#243334"/><stop offset=".7" stop-color="#3c4540"/><stop offset="1" stop-color="#172223"/></linearGradient>
    <linearGradient id="right" x1="1000" y1="0" x2="585" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#1c2c30"/><stop offset=".7" stop-color="#34403d"/><stop offset="1" stop-color="#162122"/></linearGradient>
    <linearGradient id="floor" x1="500" y1="285" x2="500" y2="650" gradientUnits="userSpaceOnUse"><stop stop-color="#162120"/><stop offset="1" stop-color="#3d4843"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#e8b56a" stop-opacity=".5"/><stop offset="1" stop-color="#e8b56a" stop-opacity="0"/></radialGradient>
    <radialGradient id="red"><stop stop-color="#fc7553"/><stop offset=".13" stop-color="#d6462e" stop-opacity=".65"/><stop offset="1" stop-color="#c9472c" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette"><stop offset=".42" stop-color="#030c0e" stop-opacity="0"/><stop offset="1" stop-color="#030c0e" stop-opacity=".65"/></radialGradient>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 0 12 12M-6 6l12 12M6-6l12 12" stroke="#172624" stroke-width="1"/></pattern>
    <pattern id="warning" width="25" height="25" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><path d="M0 0h12v25H0z" fill="#c5a369"/><path d="M12 0h13v25H12z" fill="#2b3430"/></pattern>
  </defs>
