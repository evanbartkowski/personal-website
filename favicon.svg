<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Silvery Titanium Chrome Gradients -->
    <linearGradient id="chromeBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <linearGradient id="cyberOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <radialGradient id="cyberPlateDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <linearGradient id="bannerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="18%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="82%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <linearGradient id="silverHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>

    <path id="bottomArcDark" d="M 13.5,47.5 A 22,22 0 0,0 50.5,47.5" fill="none"/>
  </defs>

  <!-- Deep Obsidian Plate with Silvery Chrome Bevel -->
  <circle cx="32" cy="32" r="29.5" fill="url(#cyberPlateDark)" stroke="url(#chromeBevel)" stroke-width="1.6"/>

  <!-- Concentric Inner Precision Rings -->
  <circle cx="32" cy="32" r="25.8" fill="none" stroke="url(#cyberOuter)" stroke-width="1.1"/>
  <circle cx="32" cy="32" r="23.2" fill="none" stroke="#475569" stroke-width="0.6" stroke-dasharray="2 1.5"/>

  <!-- Futuristic Cyber Reticle Markings -->
  <g stroke="#38bdf8" stroke-width="0.75" opacity="0.8">
    <line x1="32" y1="4" x2="32" y2="7"/>
    <line x1="32" y1="57" x2="32" y2="60"/>
  </g>

  <!-- Top: CompTIA Brand Mark in Sharp Red/Silver -->
  <text x="32" y="18" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="800" fill="#ef4444" letter-spacing="0.3">CompTIA<tspan fill="#f87171">.</tspan></text>

  <!-- Winged CSAP Crimson Ribbon -->
  <!-- Drop shadow -->
  <rect x="2.5" y="24.5" width="59" height="15" rx="1.5" fill="#000000" opacity="0.6"/>
  <!-- Red body -->
  <rect x="2.5" y="23.5" width="59" height="15" rx="1.5" fill="url(#bannerGlow)"/>
  <rect x="2.5" y="23.5" width="59" height="15" rx="1.5" fill="url(#silverHighlight)"/>
  <!-- Metallic edge borders -->
  <line x1="2.5" y1="23.5" x2="61.5" y2="23.5" stroke="#fecdd3" stroke-width="0.7"/>
  <line x1="2.5" y1="38.5" x2="61.5" y2="38.5" stroke="#881337" stroke-width="0.7"/>

  <!-- CSAP Bold Title -->
  <text x="32" y="35.3" text-anchor="middle" font-family="'Arial Black', Impact, system-ui, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1">CSAP</text>

  <!-- Bottom: Security Analytics -->
  <text x="32" y="43.5" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="3.6" font-weight="500" fill="#cbd5e1" letter-spacing="0.4">Security Analytics</text>

  <!-- Bottom: Curved PROFESSIONAL in Titanium Silver -->
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="3.2" font-weight="800" fill="#94a3b8" letter-spacing="1.2">
    <textPath href="#bottomArcDark" startOffset="50%" text-anchor="middle">PROFESSIONAL</textPath>
  </text>

  <!-- Micro Cyber Analytics Apex Point -->
  <circle cx="32" cy="57" r="0.9" fill="#38bdf8"/>
</svg>