<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyberBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e131d"/>
      <stop offset="60%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
    <linearGradient id="cyberRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="silverLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="45%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="silverRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="circuitLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <!-- Dark Obsidian Base with Subtle Rounded Corners -->
  <rect width="64" height="64" rx="15" fill="url(#cyberBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="url(#cyberRim)" stroke-width="1.2"/>
  
  <!-- Outer Cyber Shield (Beveled Left and Right Wings) -->
  <path d="M32 11 L16 16.5 L16 33 C16 41.5 22.8 48.8 32 52.5 L32 11 Z" fill="url(#silverLeft)"/>
  <path d="M32 11 L48 16.5 L48 33 C48 41.5 41.2 48.8 32 52.5 L32 11 Z" fill="url(#silverRight)"/>
  
  <!-- Inner Shield Inset Plate -->
  <path d="M32 15.5 L19.5 19.8 L19.5 32.5 C19.5 39.2 24.8 45.2 32 48.2 C39.2 45.2 44.5 39.2 44.5 32.5 L44.5 19.8 Z" fill="#080d16" stroke="url(#silverRight)" stroke-width="1" stroke-opacity="0.8"/>
  
  <!-- AI Neural Network Circuit Traces -->
  <g stroke="url(#circuitLine)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M32 18 L32 23"/>
    <path d="M32 37 L32 44.5"/>
    <path d="M23 23 L26.5 26.5"/>
    <path d="M41 23 L37.5 26.5"/>
    <path d="M22 32 L26 30.5"/>
    <path d="M42 32 L38 30.5"/>
  </g>
  
  <!-- Neural Nodes -->
  <circle cx="23" cy="23" r="1.5" fill="#e2e8f0"/>
  <circle cx="41" cy="23" r="1.5" fill="#e2e8f0"/>
  <circle cx="22" cy="32" r="1.5" fill="#38bdf8"/>
  <circle cx="42" cy="32" r="1.5" fill="#38bdf8"/>
  <circle cx="32" cy="18" r="1.5" fill="#38bdf8"/>
  <circle cx="32" cy="44.5" r="1.5" fill="#e2e8f0"/>
  
  <!-- Central AI Neural Core (Faceted Diamond/Nexus) -->
  <polygon points="32,23.5 38,30 32,36.5 26,30" fill="url(#coreGlow)"/>
  <polygon points="32,26 35.5,30 32,34 28.5,30" fill="#ffffff"/>
  <circle cx="32" cy="30" r="1.2" fill="#0f172a"/>
</svg>